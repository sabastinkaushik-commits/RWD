<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff00c8, #ff9900);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial;
        }
        h1 {
            font-size: 40px;
            animation: pop 0.8s ease;
        }
        @keyframes pop {
            from {transform: scale(0.5); opacity: 0;}
            to {transform: scale(1); opacity: 1;}
        }
    </style>
</head>
<body>

    <h1>🎉 Registration Successful!</h1>

</body>
</html>
